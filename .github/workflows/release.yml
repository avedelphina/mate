name: Release

# Merge to main, set the version, then tag the commit and push the tag:
#   git tag -a v0.5.0 -m "…" && git push origin v0.5.0
# This checks that the tag is on main, that it matches both package.json files, and that the
# changelog has a section for it. It then tests and checks the Linux packages, signs and notarises
# the disk image, and only then publishes all three artifacts, with that changelog section as its
# notes. Nothing goes live if a step before the end fails.
#
# Mate fetches no update, so there is no updater feed: the release is the packages and their notes.
#
# Required repository secrets (macOS signing):
#   CSC_LINK                     base64 of the "Developer ID Application" .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple account email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarytool
#   APPLE_TEAM_ID                10-character Apple Developer Team ID

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main and matches the version and the changelog
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge first, then tag."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for f in package.json apps/desktop/package.json; do
            pkg="$(node -p "require('./$f').version")"
            if [ "$version" != "$pkg" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $f, which says $pkg"
              exit 1
            fi
          done
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  linux:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install the external tools used by the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap libreoffice-writer poppler-utils python3 tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng xvfb
      - run: pnpm typecheck
      - run: pnpm test
      - run: xvfb-run -a pnpm test:e2e
      - run: pnpm dist:linux
      - name: Check both Linux packages
        working-directory: apps/desktop
        run: |
          shopt -s nullglob
          images=(release/*-x86_64.AppImage)
          packages=(release/*-amd64.deb)
          test "${#images[@]}" -eq 1
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}" > /dev/null
          "${images[0]}" --appimage-extract > /dev/null
          test -x squashfs-root/mate
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v7
        with:
          name: mate-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  release:
    runs-on: macos-26
    needs: [prepare, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The same checks as CI, on exactly what is being released.
      - run: pnpm build:assist
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # electron-builder imports CSC_LINK into a keychain of its own, but gives set-key-partition-list the
      # password of the .p12 where the keychain's password belongs, so it fails with "passphrase you
      # entered is not correct" (26.15.3). So the certificate is imported here, into a keychain whose
      # password is known, and electron-builder finds the identity there.
      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mate-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -p codesigning "$keychain" | grep -q "Developer ID Application"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign and notarise the disk image
        working-directory: apps/desktop
        # --publish never: the disk image goes up in the last step, after it is checked. electron-builder.yml
        # has `publish: null`, since Mate fetches no update. No CSC_LINK here: the identity is in the keychain above.
        run: pnpm exec electron-builder --mac --arm64 --publish never --config.mac.notarize=true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature, notarisation, and that the helper runs from the bundle
        working-directory: apps/desktop
        run: |
          app="release/mac-arm64/Mate.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vvv -t install "$app"
          xcrun stapler validate "$app"
          # Hardened runtime refuses a helper that is not signed with the app. It would show only as PDFs never read.
          "$app/Contents/Resources/mate-assist" --pdf < tests/fixtures/classification.pdf | grep -q 'Směrnice o klasifikaci'

      - name: Take the notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - uses: actions/download-artifact@v7
        with:
          name: mate-linux
          path: apps/desktop/release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          images=(apps/desktop/release/*.dmg)
          appimages=(apps/desktop/release/*.AppImage)
          packages=(apps/desktop/release/*.deb)
          test "${#images[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          test "${#packages[@]}" -eq 1
          gh release create "$GITHUB_REF_NAME" "${images[0]}" "${appimages[0]}" "${packages[0]}" \
            --verify-tag --latest \
            --title "Mate $GITHUB_REF_NAME" \
            --notes-file notes.md

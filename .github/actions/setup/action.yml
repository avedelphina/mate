name: Setup
description: pnpm + Node (from .nvmrc) + frozen install. Run actions/checkout first.
runs:
  using: composite
  steps:
    # The version the lockfile and pnpm-workspace.yaml (allowBuilds) were made with.
    - uses: pnpm/action-setup@v6
      with:
        version: 11.21.0
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
